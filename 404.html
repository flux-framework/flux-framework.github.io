    box-sizing: border-box;

  .nf-ring::after {

  .nf-orbit.slow span { background: var(--nf-warn); border-radius: 50%; width: 10px; height: 10px; margin-left: -5px; }

  /* Rack of compute nodes */
  .nf-rack {
    display: inline-grid;
    grid-template-columns: repeat(6, 64px);
    gap: 8px;
    padding: 14px;

    background: var(--nf-rack);
    border: 1px solid var(--nf-rack-edge);

    padding: 0 8px;

  }

    .nf *, .nf *::after { animation: none !important; }
